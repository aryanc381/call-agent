name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      bolna: ${{ steps.filter.outputs.bolna }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            bolna:
              - 'bolna-service/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir backend format
      - run: pnpm --dir backend lint
      - run: pnpm --dir backend typecheck
      - run: pnpm --dir backend build

  bolna-service:
    needs: changes
    if: needs.changes.outputs.bolna == 'true' && hashFiles('bolna-service/requirements.txt') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement bolna-service/requirements.txt
      - run: python -m ruff format --check bolna-service
      - run: python -m ruff check bolna-service
      - run: python -m mypy bolna-service
